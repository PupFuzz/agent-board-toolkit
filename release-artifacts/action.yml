name: 'release-artifacts-check'
description: >-
  Assert that every member of a repo's declared release artifact set
  (.release-pr.json's `artifacts` array) actually moved in this release PR.
  Thin composite wrapper around bin/release-artifacts-check — all logic stays
  in the script (host installs and vendoring consumers run it directly).
  Consume this action SHA-pinned
  (uses: <owner>/agent-board-toolkit/release-artifacts@<full-SHA>  # vX.Y.Z)
  so dependabot's github-actions ecosystem tracks and bumps it.
  The asserted range is the PR's OWN changes — merge-base(base, head)..head —
  never base's tip, so a commit landing on the base branch after the fork point
  can neither spuriously satisfy "this artifact moved" nor make a real release
  PR read as "version unchanged".
  THE VERDICT SURFACE IS READ FROM THE FORK POINT, because .release-pr.json is
  editable by the PR being judged: the declared set and the classification keys
  (version_file / version_regex) come from the config at merge-base, so a head
  edit may only WIDEN the set. A member declared at the fork point and absent
  from head fails in its own right — on a release PR and an ordinary one alike
  — unless it is listed in the optional `retired_artifacts` array at head,
  which is logged as a RETIRED: line instead. A member in BOTH arrays is a
  config error. A fork point with no usable config (the adoption PR that
  creates it, an unparseable or key-less one) is a ::warning:: and a fallback
  to head's keys, never a refusal.
  PRECONDITIONS in the calling job: the consumer repo must already be checked
  out with fetch-depth: 0 (the script resolves the merge base, reads the CONFIG
  at both ends, the version file at both ends, and each declared member's type
  and contents at head via `git show` / `git ls-tree`, and a shallow clone makes
  those fail — it refuses rather than classifying an unresolvable fork point or
  unreadable base as "not a release PR"), and a .release-pr.json must exist at
  the workspace root — COMMITTED at head, since the config is read from the
  commit and not from the working tree (on a pull_request event the checkout is
  the merge ref).
  A PR that does not change the version value exits 0 without asserting
  anything — apart from the fork-point comparison, which does not read the
  classification — so this action is safe to run on every pull request.
  NOTE: composite-action `required:` is not runner-enforced — the script's own
  fail-closed guards (missing --base/--head, unresolvable merge base,
  unreadable version file) are the real gate and die with actionable messages.

inputs:
  base-sha:
    description: >-
      The PR's base commit (pass github.event.pull_request.base.sha). Used only
      to resolve the fork point — the range asserted is merge-base(base, head)..head.
    required: true
  head-sha:
    description: "The PR's head commit (pass github.event.pull_request.head.sha)."
    required: true
  config:
    description: 'Per-repo release config, relative to the workspace root.'
    required: false
    default: '.release-pr.json'

runs:
  using: 'composite'
  steps:
    - name: Assert the declared release artifacts moved
      shell: bash
      # Passed through the environment, never interpolated into the run: body — a
      # `${{ }}` expansion inside a run: script is textual substitution into the shell
      # source, i.e. the Actions script-injection class.
      env:
        BASE: ${{ inputs.base-sha }}
        HEAD: ${{ inputs.head-sha }}
        CONFIG: ${{ inputs.config }}
      # --config is passed unconditionally: unlike promote/'s optional inputs it has a
      # meaningful DEFAULT value, so a blank one is a wiring error (an unset repo
      # variable), not "use the default" — the script's require_value fails closed on it.
      run: |
        "$GITHUB_ACTION_PATH/../bin/release-artifacts-check" \
          --base "$BASE" --head "$HEAD" --config "$CONFIG"
