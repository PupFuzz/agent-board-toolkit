name: 'release-artifacts-check'
description: >-
  Assert that every member of a repo's declared release artifact set
  (.release-pr.json's `artifacts` array) actually moved in this release PR.
  Thin composite wrapper around bin/release-artifacts-check — all logic stays
  in the script (host installs and vendoring consumers run it directly).
  Consume this action SHA-pinned
  (uses: <owner>/agent-board-toolkit/release-artifacts@<full-SHA>  # vX.Y.Z)
  so dependabot's github-actions ecosystem tracks and bumps it.
  The asserted range is the PR's OWN changes — merge-base(base, head)..head —
  never base's tip, so a commit landing on the base branch after the fork point
  can neither spuriously satisfy "this artifact moved" nor make a real release
  PR read as "version unchanged".
  THE VERDICT SURFACE IS READ FROM THE FORK POINT, because .release-pr.json is
  editable by the PR being judged: the declared set and the classification keys
  (version_file / version_regex) come from the config at merge-base, so a head
  edit may only WIDEN the set. A member declared at the fork point and absent
  from head fails in its own right — on a release PR and an ordinary one alike
  — unless it is listed in the optional `retired_artifacts` array at head,
  which is logged as a RETIRED: line instead. A member in BOTH arrays is a
  config error. A fork point with no usable config (the adoption PR that
  creates it, an unparseable or key-less one) is a ::warning:: and a fallback
  to head's keys, never a refusal — and the same holds per ENTRY: a malformed
  entry is rc 2 when HEAD declares it, but a ::warning:: dropped from the
  baseline when the fork point does, since the only repair for one is to
  delete it and that repair would otherwise be redded by the entry it removes.
  PRECONDITIONS in the calling job: the consumer repo must already be checked
  out with fetch-depth: 0 (the script resolves the merge base, reads the CONFIG
  at both ends, the version file at both ends, and each declared member's type
  and contents at head via `git show` / `git ls-tree`, and a shallow clone makes
  those fail — it refuses rather than classifying an unresolvable fork point or
  unreadable base as "not a release PR"), and a .release-pr.json must exist at
  the workspace root — COMMITTED at head, since the config is read from the
  commit and not from the working tree (on a pull_request event the checkout is
  the merge ref).
  A PR that does not change the version value asserts no member — but that is
  not the same as costing nothing: the fork-point comparison runs before the
  classification and independently of it, so an ordinary PR that drops a
  declared artifact without acknowledging it reds exactly as a release PR
  would. Run it on every pull request, knowing that.
  AND "the version value" is the FIRST version_regex match over content head
  owns, so an equal value at both ends is not on its own a non-release: a
  version-shaped line above the version line would otherwise make a real
  release PR read as "version unchanged" and assert nothing. On an equal
  classifying value the two ends' SETS of matched values are compared —
  exactly one value present at head and not at the fork point NAMES the
  version being shipped (a ::warning::, then every member is asserted against
  it), several is rc 2 because which one is being shipped is unknown, and none
  is the ordinary unchanged verdict. A repo whose version_regex matches more
  than its version declaration can see a non-release PR classified as a
  release one by this rule; tighten the regex (in its own PR — it is read from
  the fork point).
  IT ALSO GUARDS THE CORRELATION KEYS, which is the one leg not about
  `artifacts`: a config declaring a `promote` block must declare
  `promote.source`, `ref_token_regex` and `card_token_regex`, or name the
  missing one in an `unset_correlation_keys` array at head (logged as an
  `UNSET:` line instead of failing; a key both declared and listed, or a name
  that is not one of the three, is a config error). Absent, each of them fails
  SILENTLY downstream — `release-pr-body` emits a 0-id `shipped-cards` manifest
  at rc 0 under the line "All shipped refs have a tracking card". A key that is
  present but empty/whitespace-only, or a token regex `grep -E` cannot compile,
  is the same silent zero and is refused too. Read at HEAD only, run BEFORE the
  empty-`artifacts` opt-out (a repo that declares no artifacts still promotes),
  and SKIPPED under --classify-only, whose post-merge caller cannot act on a
  config finding. A repo with no `promote` block owes none of the three keys.
  ⚠ HEAD-ONLY MEANS THE PIN DOES NOT CONTAIN THIS LEG. On a pull_request event
  GitHub takes the workflow — and therefore this action's SHA pin — from the
  BASE-merged ref, while the recipe passes head-sha: the pin travels with the
  base branch and the config does not. The first bump of this pin on your
  integration branch therefore reds every branch you have open that was cut
  BEFORE the correlation keys landed, on a config it never touched. Do not fix
  that as a config bug: merge the base branch (the refusal message says so
  first). Branches carrying the keys, and the release PR itself, are unaffected.
  NOTE: composite-action `required:` is not runner-enforced — the script's own
  fail-closed guards (missing --base/--head, unresolvable merge base,
  unreadable version file) are the real gate and die with actionable messages.

inputs:
  base-sha:
    description: >-
      The PR's base commit (pass github.event.pull_request.base.sha). Used only
      to resolve the fork point — the range asserted is merge-base(base, head)..head.
    required: true
  head-sha:
    description: "The PR's head commit (pass github.event.pull_request.head.sha)."
    required: true
  config:
    description: 'Per-repo release config, relative to the workspace root.'
    required: false
    default: '.release-pr.json'

runs:
  using: 'composite'
  steps:
    - name: Assert the declared release artifacts moved
      shell: bash
      # Passed through the environment, never interpolated into the run: body — a
      # `${{ }}` expansion inside a run: script is textual substitution into the shell
      # source, i.e. the Actions script-injection class.
      env:
        BASE: ${{ inputs.base-sha }}
        HEAD: ${{ inputs.head-sha }}
        CONFIG: ${{ inputs.config }}
      # --config is passed unconditionally: unlike promote/'s optional inputs it has a
      # meaningful DEFAULT value, so a blank one is a wiring error (an unset repo
      # variable), not "use the default" — the script's require_value fails closed on it.
      run: |
        "$GITHUB_ACTION_PATH/../bin/release-artifacts-check" \
          --base "$BASE" --head "$HEAD" --config "$CONFIG"
