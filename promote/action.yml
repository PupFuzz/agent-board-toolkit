name: 'promote-released-cards'
description: >-
  Move a release's tracking kanban cards to the released stage. Thin composite
  wrapper around bin/promote-released-cards — all logic stays in the script
  (host installs and vendoring consumers run it directly). Consume this action
  SHA-pinned (uses: <owner>/agent-board-toolkit/promote@<full-SHA>  # vX.Y.Z)
  so dependabot's github-actions ecosystem tracks and bumps it.
  PRECONDITIONS in the calling job: the consumer repo must already be checked
  out with fetch-depth: 0 + fetch-tags (the script derives the shipped-ref
  range from the CONSUMER's git history; it fail-closes on a tagless/shallow
  clone), and a .release-pr.json with a .promote block must exist at the
  workspace root — including .promote.source, which is REQUIRED and has no
  default: the script refuses before any read without it (see the `source`
  input below, and INSTALL.md §4).
  AND THE DECLARED SOURCE MUST BE THIS REPO. A resolved source other than "*"
  is compared, case-folded, against $GITHUB_REPOSITORY — which Actions sets to
  the repository this workflow runs in — and a mismatch refuses at rc 2 before
  any board read. A typo'd or copy-pasted slug otherwise passes every shape
  check and correlates against no card: the job promotes 0 and exits 0. The
  leg applies to the `source` input too (it overrides the value, not the
  check), and does not fire when $GITHUB_REPOSITORY is absent. A FORK running
  this workflow is refused by it, on the fork's own $GITHUB_REPOSITORY.
  NOTE: composite-action `required:` is not runner-enforced — the script's own
  fail-closed guards (missing token / expected-host / api_base host mismatch)
  are the real gate and die with actionable messages.

inputs:
  writeback-token:
    description: 'Kanban API bearer token whose user is a member of the target board (pass a secret).'
    required: true
  expected-host:
    description: >-
      The kanban host the token may be sent to (e.g. kanban.example.com).
      Required by the script's fail-closed api_base host guard; pin it as a
      repo/org VARIABLE, out-of-band from the PR-editable .release-pr.json.
    required: true
  api-base:
    description: >-
      Real API base (https://<host>/api/v3), passed to the script as
      $KANBAN_API_BASE, which overrides .promote.api_base. Use when the
      committed value is a host-scrubbed placeholder — which it normally is,
      since the real kanban host does not belong in a repo. Empty = use the
      committed value. Pin it as a repo/org VARIABLE, like expected-host: with
      both supplied out-of-band, a PR editing .release-pr.json can move neither
      the token's destination nor the host guard that constrains it. The value
      is host-validated against expected-host either way.
    required: false
    default: ''
  dls:
    description: 'DLs to promote (comma-separated). Blank = derive from the git range.'
    required: false
    default: ''
  source:
    description: >-
      Optional override for .promote.source, the REQUIRED repo-qualification
      key. "<owner>/<repo>" qualifies every ref-matched card against that repo;
      "*" DECLARES that the board tracks exactly one repo. Blank (default) =
      use the committed .promote.source, which must then be present — the
      script refuses to run without one of the two, because dl_number and
      pr_number are repo-scoped counters and an unqualified match on a
      multi-repo board promotes another repo's cards into a terminal stage.
      NOT an escape hatch from the identity check above: whichever channel
      wins, a resolved value other than "*" must equal $GITHUB_REPOSITORY.
    required: false
    default: ''
  shipped-stage-ids:
    description: >-
      Optional comma-separated numeric workflow_stage_ids that count as a
      "Shipped-class" source stage. When set, a DL/PR-matched card whose CURRENT
      stage is NOT in this list is SKIPPED (with a log line) instead of moved —
      promotion only ever moves a card from a Shipped-class stage to Released, so
      it never resurrects a declined/backlog card carrying a stale or recycled
      DL/PR stamp. Blank (default) = no source-stage guard, byte-identical prior
      behavior — consumers opt in on their own windows.
    required: false
    default: ''
  require-complete:
    description: >-
      'true' = the opt-in COMPLETENESS GATE (--require-complete): a matched card
      is refused, not promoted, while a PR outside this release still names it
      on its head branch (open, or merged to the integration branch after the
      release was cut), or when those PRs cannot be read. The oracle reads
      GitHub with this job's token, so the calling workflow must grant
      `pull-requests: read` and `contents: read`. Default 'false' = no gate,
      byte-identical prior behavior. The predicate and what it cannot see are
      in bin/card-completeness's header.
      ⚠ EXACTLY 'true' or 'false', lower-case. Any other spelling ('True', 'TRUE', 'yes', '1')
      REFUSES the step at rc 2 rather than being read as 'false' — an unrecognised value used
      to leave the gate silently OFF on a run that looked like a gated one.
    required: false
    default: 'false'
  dry-run:
    description: >-
      'true' = report only, move nothing.
      ⚠ EXACTLY 'true' or 'false', lower-case, and for the same reason as above with a worse
      failure: any other spelling REFUSES the step at rc 2, because reading it as 'false'
      performed REAL board writes for an operator who asked for a preview.
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Promote tracking cards
      shell: bash
      env:
        KANBAN_WRITEBACK_TOKEN: ${{ inputs.writeback-token }}
        KANBAN_EXPECTED_HOST: ${{ inputs.expected-host }}
        KANBAN_API_BASE: ${{ inputs.api-base }}
        INPUT_DLS: ${{ inputs.dls }}
        INPUT_SOURCE: ${{ inputs.source }}
        SHIPPED_STAGE_IDS: ${{ inputs.shipped-stage-ids }}
        REQUIRE_COMPLETE: ${{ inputs.require-complete }}
        # The job token reaches the step only when the gate is on — the oracle is its one reader.
        # ⛔ THIS TEST'S ACCEPT-SET AND THE `bool` GUARD IN THE run: BODY MUST STAY EQUAL. An
        # Actions expression cannot call a shell function, so this is a SECOND spelling of "is
        # this input on" and the two can only be held level from outside: any spelling this
        # accepts and `bool` refuses would ship a token to a step that then dies, and any
        # spelling `bool` accepts and this refuses would run the gate WITHOUT a credential —
        # every card UNMEASURED, i.e. a release that refuses every promotion. `bool` refuses
        # everything but 'true'/'false'/'', which is what makes this literal test sufficient;
        # `tests/composite-action-wiring-selftest.sh` reds if either side moves alone.
        GITHUB_TOKEN: ${{ inputs.require-complete == 'true' && github.token || '' }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        # api-base reaches the script as $KANBAN_API_BASE (env above), which the script reads
        # in preference to .promote.api_base. It used to be REWRITTEN INTO the checked-out
        # .release-pr.json with jq, because the script had no env channel for it (card#7494)
        # — a workaround that only the action could apply, so a host or non-Actions consumer
        # running the same script had no way at all to name a real host without committing
        # one. That rewrite is gone rather than kept beside its own fix: two ways to set one
        # value is how they drift, and mutating a security-sensitive file in the consumer's
        # workspace mid-job is a side effect no caller asked for. Blank input = unset = the
        # committed value, exactly as before.
        #
        # Each optional input is translated to an ABSENT flag when blank — never to a flag
        # carrying an empty value. Load-bearing since card#5144: the script now REJECTS
        # `--flag ""` (an empty value silently selected the flag's default path — for
        # --shipped-stages that meant an unguarded promote reported as a clean run). So
        # "unconditionally pass the flag and let the script sort it out" would fail-closed on
        # every consumer that leaves an optional input blank. Keep these conditional.
        #
        # ⛔ A BOOLEAN INPUT IS VALIDATED, NEVER READ AS "off" ON A SPELLING THE TEST DOES NOT
        # KNOW (card#10176 r2). `[ "$X" = "true" ]` answers false for 'True', 'TRUE', 'yes' and
        # '1' alike, and the run that follows is byte-identical to one where the input was never
        # passed — so nothing in stdout or stderr says the input did not take. For
        # `require-complete` that is the gate silently OFF (its state line prints only when the
        # gate is ON, by design, so an OFF run is silent by contract); for `dry-run` it is worse
        # and is why this is a guard rather than a fix to one line: the operator asked for a
        # PREVIEW and gets REAL BOARD WRITES into a terminal stage. Two members of one shape ⇒
        # one function, so a THIRD boolean input cannot arrive unguarded by writing the same
        # test a third time. `shipped-stage-ids` is deliberately NOT here: it is passed through
        # as a VALUE and the script validates it, which is the other correct answer.
        bool() {
          case "$2" in
            true)     return 0 ;;
            false|'') return 1 ;;
            *) echo "::error::promote: ${1}='${2}' is not a boolean. Pass exactly 'true' or 'false' (lower-case, quoted) — REFUSING rather than reading an unrecognised value as 'false', because that runs with ${1} silently OFF and no output says so: for dry-run it means REAL board writes where a preview was asked for, and for require-complete a release that promotes cards the gate was meant to refuse." >&2
               exit 2 ;;
          esac
        }
        args=()
        [ -n "$INPUT_DLS" ] && args+=(--dls "$INPUT_DLS")
        [ -n "$INPUT_SOURCE" ] && args+=(--source "$INPUT_SOURCE")
        [ -n "$SHIPPED_STAGE_IDS" ] && args+=(--shipped-stages "$SHIPPED_STAGE_IDS")
        bool require-complete "$REQUIRE_COMPLETE" && args+=(--require-complete)
        bool dry-run "$DRY_RUN" && args+=(--dry-run)
        "$GITHUB_ACTION_PATH/../bin/promote-released-cards" "${args[@]}"
