# Split out of ci.yml (card#6062) for its TRIGGER, not for isolation: a job living in ci.yml
# gets ci.yml's `pull_request` event set, which does not include `edited` — and this gate's
# obligation set is a function of the PR TITLE, which only an `edited` event reports.
name: Changelog card entry

on:
  push:
    branches: [main, dev]
  pull_request:
    # `edited` is load-bearing HERE for the TITLE (not, as in release-artifacts-gate.yml, for
    # the base): the obligation set includes the PR title, and adding the `card#NNNN` token to
    # a title fires `edited` — never `synchronize`, which needs a push. Without it the gate
    # answers on the pre-edit title, err-GREENS on the PR, and reds on `dev` after the merge,
    # with the omission already landed. `edited` also fires on body and base edits, which
    # re-run the job for nothing: accepted — one checkout plus a `git log` and a grep.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  changelog-card-entry:
    # Asserts every card shipped since the last release tag owns a bullet in docs/CHANGELOG.md's
    # `[Unreleased]` region — the convention that was enforced by nothing until card#5767, and that
    # 3 of the 24 cards merged since v0.23.1 had skipped. TWO STEPS, ONE JOB (card#11698): the
    # selftest proves `bin/changelog-gate` against fixtures, then the toolkit consumes its own
    # `./changelog-gate` action exactly as a consumer repo does. The job id is unchanged — it is a
    # required context, and `tests/ci-gate-selftest.sh` already places it.
    #
    # Deliberately its OWN job, not a `selftest` matrix entry, for a mechanical reason: the live
    # step derives its obligation set from the commits since the last release tag that the tag has
    # not already shipped (card#11034), which needs full history AND tags — the matrix job checks
    # out at the default depth 1, whose truncated history resolves no tag at all, so the gate would
    # refuse rather than pass blindly. Being named in this `run:` block satisfies ci-matrix-parity's
    # one rule for the selftest.
    runs-on: ubuntu-latest
    steps:
      # ⛔ THE DEFAULT `ref:` IS LOAD-BEARING FOR THE VERDICT, not only for the checkout
      # (card#10338). On a pull_request event this action leaves the MERGE COMMIT
      # `refs/pull/N/merge` in the tree, and the gate judges this PR's own tokens on the diff from
      # its first parent — the diff the squashed commit will record on `dev` — and reads the fold
      # diagnosis off that merge. Pinning `ref:` to the HEAD branch would leave a checkout with no
      # merge commit, and the gate would silently judge every commit on its own diff instead. The
      # run prints which basis answered. `fetch-depth: 0` also fetches every branch, which a
      # release-classified PR needs (it reads `changelog.*` where it was cut from origin/dev).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: the changelog gate's fixtures
        run: bash tests/changelog-card-entry-selftest.sh
      - name: every card shipped since the last tag owns a CHANGELOG entry
        uses: ./changelog-gate
        with:
          # Under squash-merge the commit subject IS the PR title, so before merge the title is the
          # only witness of the card this PR will land under — without it the check would pass here
          # and fail on the push to `dev` afterwards, with the omission already merged. All four PR
          # fields are empty on a `push` run, which is what makes the gate run as a push run.
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          pr-title: ${{ github.event.pull_request.title }}
          head-ref: ${{ github.event.pull_request.head.ref }}
