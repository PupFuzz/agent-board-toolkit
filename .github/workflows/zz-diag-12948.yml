name: diag-12948
on:
  push:
    branches: [card-12948]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: sigint disposition of async lists
        run: |
          bash --version | head -1
          bash -c '( setsid bash -c "grep SigIgn /proc/\$\$/status" & ); sleep 0.5; ( cd /tmp && setsid bash -c "grep SigIgn /proc/\$\$/status" & ); sleep 0.5; ( cd /tmp && bash -c "grep SigIgn /proc/\$\$/status" & ); sleep 0.5'
      - name: repro uutils timeout
        run: bash tests/zz-diag/int-repro.sh timeout || true
      - name: repro gnu timeout
        run: bash tests/zz-diag/int-repro.sh gnutimeout || true
      - name: selftest with GNU coreutils first on PATH
        run: |
          mkdir "$RUNNER_TEMP/gnubin"; for f in /usr/bin/gnu*; do ln -s "$f" "$RUNNER_TEMP/gnubin/${f#/usr/bin/gnu}"; done
          export PATH="$RUNNER_TEMP/gnubin:$PATH"; timeout --version | head -1
          bash tests/release-pr-body-selftest.sh 2>&1 | grep -E 'FAIL|SIGINT|interrupted|passed' || true
