# The toolkit's own adoption of the release-artifact gate (card#5910). The class rule: every
# member of a must-move-together set is READ by the guard and a missing member FAILS the PR —
# a guard reading a proper subset cannot fail on the member it never reads, which is how
# `VERSION` ↔ `docs/CHANGELOG.md` ↔ `CLAUDE.md § Recent releases` shipped with no guard at all
# while `.release-pr.json`'s `artifacts` array merely PRINTED them as a checklist. Post-merge
# auto-tag workflows stay fail-soft everywhere BY DESIGN; this asserts at release-PR time,
# where the fix is a commit rather than a retag.
#
# No `paths:` filter, deliberately — the gate must observe EVERY pull request to classify it.
# docs/INSTALL.md §6c owns the classification rule and what a non-release PR costs; it is not
# restated here, because a second copy is a second thing to correct.
name: Release artifacts

on:
  pull_request:
    # `edited` is load-bearing: retargeting a PR's BASE fires `edited`, and the verdict is a
    # function of the base (merge-base drives both the classification and the asserted diff) —
    # NOT for the title, which the action never reads.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Required by the action — docs/INSTALL.md §6c ("What the check reads") owns the read
          # inventory and why a shallow clone cannot serve it.
          fetch-depth: 0
      - uses: ./release-artifacts
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
