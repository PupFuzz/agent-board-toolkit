name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    # THE ANALYSER IS PINNED, NOT INHERITED (card#6619). Every shellcheck call in this file goes
    # through `bin/_shellcheck-pinned`, which runs the version `.shellcheck-version` declares and
    # prints on stderr which binary it actually ran — so a log says what produced its verdict, and a
    # local sweep of these same commands is about the same program. A bare `shellcheck` here would
    # take whatever the runner image ships this month; the two ends of that drift disagree at ERROR
    # severity, measured, with the reproduction in `.shellcheck-version`. The image happens to ship
    # the pinned version today, so the wrapper resolves it off PATH and downloads nothing;
    # `tests/shellcheck-pin-selftest.sh` holds this rule over the whole workflow directory and
    # drives the download arm that CI therefore never exercises.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: shellcheck bin/, hooks/ and tests/
        # Gate at hard errors only for now; tighten to `-S warning` once a clean
        # run confirms the existing scripts are warning-clean. Non-shell helpers
        # (e.g. bin/*.py shims) are filtered out — shellcheck cannot parse them
        # (SC1071); they are syntax-checked in the python-shims step below.
        run: ./bin/_shellcheck-pinned -S error $(find bin hooks -maxdepth 1 -type f ! -name '*.py'; find tests -maxdepth 1 -type f -name '*.sh')
      - name: python shims compile clean
        # `compile()` — NOT `py_compile`, and NOT `ast.parse` (card#7207).
        #
        # `py_compile` WRITES the bytecode it produces, beside each source, i.e. into
        # `bin/__pycache__`. Every entry of `bin/` becomes a PATH entry under the documented
        # install (`docs/INSTALL.md` §2 globs `bin/*` and symlinks each one), so this step was
        # re-minting the exact non-tool directory card#6871 removed — invisibly, because a
        # GitHub runner's checkout is disposable and `.gitignore` keeps it out of `git status`.
        # The damage is LOCAL, on every seat that runs these gates by hand before opening a PR.
        #
        # `ast.parse` writes nothing and was the first fix proposed, but it asks a WEAKER
        # question. Measured on python 3.12.3, it ACCEPTS all of: `return`, `break`, `continue`,
        # `yield` and `await` outside their construct, `def f(a, a)`, an unbound `nonlocal`, and
        # `*a = [1]` — eight of the ten error classes `py_compile` rejects. Swapping it in would
        # have loosened the gate to make the artifact go away.
        #
        # `compile(src, f, 'exec')` is `py_compile`'s own check MINUS the write: it rejects all
        # ten, handles a PEP 263 coding cookie the same way (bytes in, not str), and caches
        # nothing anywhere. Every bad file is reported, not just the first.
        #
        # BOTH `SyntaxError` AND `ValueError` are caught, and the `line=` field is omitted when
        # the exception carries no line. A source containing a NUL byte is the case, and the class
        # it raises MOVED under us — CPython gh-96670, "the parser now raises SyntaxError when
        # parsing source code containing null bytes", quoted from the NEWS file shipped with 3.12
        # — so a one-class `except` here is a bet on the runner's interpreter version. MEASURED on
        # 3.12.3: `SyntaxError` with `lineno` None, so the old annotation read `line=None`, a
        # location that does not exist. On an interpreter raising the other class (documented as
        # `ValueError`; NOT verifiable on this box, which has only 3.12) it escapes as an uncaught
        # traceback, which ABORTS THE LOOP and leaves every later file unchecked at an exit status
        # that still says 1.
        #
        # `tests/python-syntax-gate-selftest.sh` runs THIS block verbatim — extracted from this
        # file by step name, never restated — over planted fixtures, and holds a no-`py_compile`
        # rule over every `run:` block in this directory AND in the composite actions, so the
        # artifact cannot come back by another hand.
        run: |
          python3 - bin/*.py <<'PY'
          import sys
          rc = 0
          for f in sys.argv[1:]:
              with open(f, "rb") as fh:
                  src = fh.read()
              try:
                  compile(src, f, "exec")
              except (SyntaxError, ValueError) as e:
                  line = getattr(e, "lineno", None)
                  loc = f",line={line}" if line else ""
                  print(f"::error file={f}{loc}::{getattr(e, 'msg', None) or e}", file=sys.stderr)
                  rc = 1
          sys.exit(rc)
          PY

  drift-check-selftest:
    # NARROW BY DESIGN — and narrower than it reads. Passing the same directory as both
    # TOOLKIT and REPO leaves only ONE of drift-check's three legs able to fail: content-drift
    # diffs every file against itself, and version-skew is gated on a
    # `.agent-board-toolkit-version` the toolkit root does not carry. What a green tick here
    # certifies is that the shipped tree still carries `bin/_kb-board-lib.sh` beside its
    # sourcers (card#5356).
    #
    # KEEP IT ANYWAY: that MISSING-LIB assertion is about the SHIPPED tree, which the
    # fixture-driven `drift-check-fixture-selftest` cannot make a claim about. The two are
    # complements, not duplicates — the fixture test ADDS the two dead legs, it does not
    # replace this job.
    #
    # ⚠ THIS COMMENT USED TO SAY this job's name "is also a required status check on `main`". It
    # was true when written and is NOT true now — `branches/main/protection` answers
    # `required_status_checks: null` (read live, card#8261); the fleet branch-protection model
    # applied on 2026-08-30 replaced the whole protection object without carrying the contexts
    # over. The one name branch protection pins is `ci-gate` below, which depends on this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: drift-check runs and reports no drift against itself
        run: ./bin/agent-board-toolkit-drift-check . .

  ci-matrix-parity:
    # Asserts every tests/*-selftest.sh is actually RUN by some pull-request-triggered workflow
    # — the guard for the matrix list below, which was hand-aligned behind a comment until
    # card#5355. Its population is the whole workflow directory, not this file: card#6062 moved
    # the `changelog-card-entry` job into its own workflow (for a trigger this file cannot
    # give it), and a scan of ci.yml alone would report that test as unrun.
    #
    # It also holds the TRIGGER CONTRACT over that directory (card#6099): no workflow observes
    # fewer than all pull requests (a `paths:`/`branches:` filter, or a `types:` list missing
    # `opened`/`synchronize`), and every workflow that reads a `github.event.pull_request.*`
    # field subscribes `edited` on every PR trigger it has. Neither rule has an instance on
    # this tree — the reasoning, the bounds, and the fixtures that keep both from being
    # decorations are in the selftest's own header rather than restated here.
    #
    # Deliberately its OWN job, not a `selftest` matrix entry: a matrix entry would be
    # self-referential, so deleting that one line would disable the guard silently — the exact
    # hole it closes. Being named in this `run:` block is also how it satisfies the rule it
    # enforces (matrix entry OR named in a run: block), with no exception list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: every selftest is run by a PR-triggered workflow, and the triggers hold their contract
        run: bash tests/ci-matrix-parity-selftest.sh

  selftest:
    # The network-free `tests/*-selftest.sh` scripts, one matrix job each — they were 10
    # byte-for-byte-identical checkout+`bash tests/X.sh` jobs whose only difference was the
    # filename (dedup-audit D6-CI). Each selftest documents WHAT it guards (and the regression
    # that motivated it) in its own file header, so that context is not lost by collapsing the
    # per-job CI comments. fail-fast:false keeps every selftest running independently, exactly
    # as the separate jobs did — one failure must never cancel the siblings. The `drift-check`,
    # `shellcheck`, and `promote-action` jobs stay separate: they do NOT run `bash tests/X.sh`.
    #
    # A new selftest needs a matrix entry here, the same as it needed its own job before.
    # This list is no longer kept in sync by diligence alone: the `ci-matrix-parity` job above
    # fails the build when a `tests/*-selftest.sh` exists that no PR-triggered workflow runs
    # (card#5355). An intentionally non-matrix test is wired by naming it in its own job's
    # `run:` block — in this file or in a sibling workflow (card#6062) — which satisfies the
    # guard too, so there is no exception list to maintain.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - adopt-to-dl-selftest
          - agent-dispatch-card-start-selftest
          - bin-artifact-hygiene-selftest
          - board-card-start-selftest
          - board-session-close-selftest
          - board-snapshot-selftest
          - board-stats-selftest
          - bsc-same-dir-selftest
          - ci-gate-selftest
          - composite-action-wiring-selftest
          - dependabot-reconcile-selftest
          - dl-a0-backfill-triaged-selftest
          - dl-a1-register-field-selftest
          - drift-check-fixture-selftest
          - e2e-harness-containment-selftest
          - fetch-board-cards-caller-claims-selftest
          - gh-code-search-selftest
          - gitignore-secret-family-selftest
          - help-output-selftest
          - install-board-hooks-capability-selftest
          - kb-board-lib-selftest
          - kb-host-guard-selftest
          - kb-positional-guard-selftest
          - kbc-archive-eligible-selftest
          - kbc-may-archive-selftest
          - kbc-stale-blocker-selftest
          - kbcard-field-selftest
          - kbcard-selftest
          - lib-set-derivation-selftest
          - locale-range-guard-selftest
          - next-dl-selftest
          - no-task-wrapper-selftest
          - path-link-recipe-selftest
          - piped-match-gate-selftest
          - pipeline-free-match-selftest
          - prelude-shadow-selftest
          - promote-pagination-selftest
          - promote-ref-canon-selftest
          - promote-source-qualify-selftest
          - promote-stage-guard-selftest
          - python-syntax-gate-selftest
          - read-outcome-collapse-selftest
          - reader-ref-canon-selftest
          - readme-bin-coverage-selftest
          - release-artifacts-selftest
          - release-pr-body-selftest
          - release-tag-check-selftest
          - run-coverage-check-selftest
          - runtime-check-selftest
          - shellcheck-pin-selftest
          - url-userinfo-render-selftest
          - value-flag-derivation-selftest
          - verdict-through-truncating-reader-selftest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: bash tests/${{ matrix.test }}.sh
        run: bash "tests/${{ matrix.test }}.sh"

  suite-home-containment:
    # Runs EVERY tests/*selftest*.sh under a sacrificial HOME and asserts nothing is left in it
    # — the property card#7245's incident actually violated ("the suite writes nothing outside
    # its scratch"), as opposed to the sub-population the e2e-harness containment test declares.
    #
    # ⛔ NOT a `selftest` matrix entry, for two mechanical reasons — the same two that put
    # `ci-matrix-parity` and `changelog-card-entry` in their own jobs:
    #
    #   1. SELF-REFERENCE. It runs the suite, so as a matrix entry it would be handed itself
    #      and recurse. It excludes itself by name, and that exclusion is asserted — but a
    #      meta-check that must skip one member of the list it is generated from does not
    #      belong in that list.
    #   2. fetch-depth: 0, WHICH THE MATRIX CANNOT GIVE IT. The matrix job has ONE shared
    #      checkout for all 44 entries, at the default depth 1. One subject —
    #      `changelog-card-entry-selftest` — derives its obligation set from
    #      `git log <last release tag>..HEAD` and REFUSES (rc 1) when no tag resolves, which is
    #      deliberate: it fails loud rather than passing blindly on a truncated history. Under
    #      a depth-1 checkout it therefore never runs, its containment is never measured, and
    #      this job's UNMEASURED leg correctly reds — which is exactly what happened on the
    #      first CI run of this instrument. The fix belongs to the POPULATION, not the verdict:
    #      give the subject the history it needs so it genuinely runs. Widening the matrix
    #      checkout to depth 0 for all 45 jobs to serve one subject is the wrong trade.
    #
    # PR_TITLE is deliberately NOT passed. It is a second obligation SOURCE for that subject,
    # not something it needs in order to run — without it the subject checks merged history
    # instead, which exercises the same write surface (a git read plus a grep, into its own
    # $TMP). Passing it would couple THIS job's containment verdict to whether some card is
    # missing a CHANGELOG entry, reporting an unrelated content failure as "containment not
    # measured". The title check has its own job, which owns that question.
    #
    # ~4 min: it is the suite, once more. That is the price of measuring the property instead
    # of asserting it, and the incident it exists to prevent cost a hand-restored credential.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + tags: see reason 2 above. A truncated checkout does not make this
          # job fail — it makes one subject UNMEASURED, which is a finding, not a pass.
          fetch-depth: 0
      - name: every selftest writes nothing outside its own scratch
        run: bash tests/suite-home-containment-selftest.sh

  promote-action-selftest:
    # Guards the composite action's wiring: SHA-pinned consumers get no
    # toolkit-side signal if the wrapper rots (the shellcheck job's population is bin/,
    # hooks/ and tests/ — never promote/action.yml's embedded run: block).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Wiring assertions (parse, script path, flag contract, embedded shellcheck)
        run: |
          test -x bin/promote-released-cards
          # The flag-parity contract is DERIVED from the wrapper, not enumerated here. It used
          # to be three hand-written `grep -q -- '--dls)'` lines, i.e. a guard reading a proper
          # SUBSET of the must-agree set: a FOURTH action input would have been guarded by
          # nothing, and no assertion could fail on the flag it never read (card#5910's class).
          python3 - <<'PY'
          import re, yaml

          SCRIPT = '"$GITHUB_ACTION_PATH/../bin/promote-released-cards"'
          d = yaml.safe_load(open('promote/action.yml'))
          assert d['runs']['using'] == 'composite', 'promote/action.yml is no longer a composite action'
          step = d['runs']['steps'][0]
          assert step['shell'] == 'bash', 'the promote step is no longer a bash step'
          run = step['run']
          assert SCRIPT in run, 'the promote step no longer execs bin/promote-released-cards'

          # Every `--flag` token appearing anywhere ON an `args+=( … )` append LINE, plus any on
          # the exec line itself. The scan is per line, so a multi-line append derives nothing
          # from its continuation lines — today's wrapper writes one append per line. Scanning
          # the whole line rather than anchoring on the append's first token is deliberate:
          # `args+=("--bogus-flag" …)` and `args+=(--a --b)` both escaped a first-token-only
          # pattern silently, which is the very shape this check exists to stop. It
          # OVER-collects by design — a `--`-leading VALUE literal would also be picked up and
          # demand a case arm, which errs RED (a spurious required arm), never green (a flag
          # nobody guards).
          FLAG = r'--[A-Za-z0-9][A-Za-z0-9-]*'
          flags = set()
          for line in run.splitlines():
              s = line.strip()
              if s.startswith('#'):
                  continue
              if 'args+=(' in s:
                  flags.update(re.findall(FLAG, s.split('args+=(', 1)[1]))
              # The exec-line half collects NOTHING from today's wrapper, which passes only
              # "${args[@]}". It is kept for the direct-flag spelling (`… script --foo`) that a
              # future edit could introduce — an unexercised branch here, verified by mutation
              # rather than by the live file.
              if SCRIPT in s:
                  flags.update(re.findall(FLAG, s.split(SCRIPT, 1)[1]))

          derived = sorted(flags)
          print('derived wrapper flags: ' + ' '.join(derived))

          # CONTROL — a parser that silently derives NOTHING must fail, not pass vacuously.
          # `--dry-run` is a named witness rather than a count: a count pins this to a past
          # value and rots the moment an input is added.
          assert derived, 'derived ZERO flags from the run block — the parser, not the wrapper, is broken'
          assert '--dry-run' in derived, f'the derivation lost a known flag; got {derived}'

          src = open('bin/promote-released-cards').read()
          missing = [f for f in derived if f + ')' not in src]
          assert not missing, f'wrapper passes flags with no case arm in bin/promote-released-cards: {missing}'
          print(f'all {len(derived)} derived flag(s) have a `--flag)` case arm in bin/promote-released-cards')

          # extract the embedded run block and shellcheck it under the runner's flags
          with open('/tmp/action-run.sh', 'w') as f:
              f.write('#!/usr/bin/env bash\nset -e -o pipefail\n' + run)
          PY
          ./bin/_shellcheck-pinned -S error /tmp/action-run.sh
      - name: Invoke the action (expects fail-closed at the token guard)
        # Proves the runner can execute the composite end-to-end into the
        # script: with an empty token it must die at the KANBAN_WRITEBACK_TOKEN
        # guard (deterministic, no network). Success here would mean the guard
        # rotted; any other wiring breakage also lands in 'failure'.
        id: smoke
        continue-on-error: true
        uses: ./promote
        with:
          writeback-token: ''
          expected-host: kanban.invalid
          dry-run: 'true'
      - name: Assert fail-closed
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          [ "$SMOKE_OUTCOME" = "failure" ] || { echo "::error::promote action ran with an empty token — the fail-closed guard did not fire"; exit 1; }

  release-artifacts-action-selftest:
    # The promote job's sibling, for the same reason: a SHA-pinned consumer gets no
    # toolkit-side signal if the wrapper rots, and the shellcheck job's population does not
    # reach this action's embedded run: block either.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # the action's own precondition; the smoke step below needs it
      - name: Wiring assertions (parse, script path, embedded shellcheck)
        run: |
          test -x bin/release-artifacts-check
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open('release-artifacts/action.yml'))
          assert d['runs']['using'] == 'composite', 'release-artifacts/action.yml is no longer a composite action'
          step = d['runs']['steps'][0]
          assert step['shell'] == 'bash', 'the step is no longer a bash step'
          assert '"$GITHUB_ACTION_PATH/../bin/release-artifacts-check"' in step['run'], \
              'the step no longer execs bin/release-artifacts-check'
          env, run = step.get('env') or {}, step['run']
          # Every DECLARED input must reach the script. The wrapper carries no logic, so an
          # input it accepts and drops is an input that silently does nothing — and the
          # declared set is read from the file, so a fourth input cannot escape this loop.
          wiring = {'base-sha': ('BASE', '--base'), 'head-sha': ('HEAD', '--head'),
                    'config': ('CONFIG', '--config')}
          assert set(d['inputs']) == set(wiring), \
              f"inputs changed; teach this check the new wiring: {sorted(set(d['inputs']) ^ set(wiring))}"
          for name, (var, flag) in wiring.items():
              assert f'inputs.{name}' in env.get(var, ''), f'input {name} is not passed through env as {var}'
              assert f'{flag} "${var}"' in run, f'input {name} does not reach the script as {flag} "${var}"'
          # An Actions expression inside a run: body is textual substitution into the shell
          # source — the script-injection class. Inputs travel by env or not at all.
          # The needle is BUILT, never written literally: a bare `${`+`{` in THIS run: body is
          # itself an Actions expression the runner would try to evaluate, and an unterminated
          # one is a workflow parse error — the check would break the file it is checking.
          assert '$' + '{{' not in run, 'the run: body interpolates an Actions expression'
          with open('/tmp/ra-action-run.sh', 'w') as f:
              f.write('#!/usr/bin/env bash\nset -e -o pipefail\n' + run)
          PY
          ./bin/_shellcheck-pinned -S error /tmp/ra-action-run.sh
      - name: Invoke the action (degenerate same-sha range ⇒ classifies as not-a-release-PR)
        # Proves the runner can execute the composite end-to-end into the script. base == head
        # means the version is byte-identical at both ends, which is the exit-0 arm — so this
        # asserts "runs end-to-end", not "asserts artifacts". Any wiring breakage lands in
        # 'failure' (a missing script, an unparseable config, a shallow-clone read).
        id: smoke
        continue-on-error: true
        uses: ./release-artifacts
        with:
          base-sha: ${{ github.sha }}
          head-sha: ${{ github.sha }}
      - name: Assert the degenerate case runs clean
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          [ "$SMOKE_OUTCOME" = "success" ] || { echo "::error::release-artifacts action failed on a same-sha range — the wrapper does not reach the script"; exit 1; }

  release-tag-check-action-selftest:
    # The third action's runner leg. Its WIRING assertions are NOT inline here: they live in
    # `tests/composite-action-wiring-selftest.sh`, which derives its population from every
    # `action.yml` OR `action.yaml` in the tree — both spellings, because GitHub honours both —
    # so this action, the two above, and any later one are all covered by one guard, and it runs
    # as a `selftest` matrix entry. What this job adds is the part no local
    # test can stand in for — the RUNNER actually executing the composite, in both directions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # the action's own precondition; both smoke steps below need it
      - run: test -x bin/release-tag-check

      - name: Invoke the action (degenerate same-sha range ⇒ not a release ⇒ asserts no tag)
        # Deterministic and network-free: base == head means the version is byte-identical at
        # both ends, so the classifier returns not-release and the tool exits 0 BEFORE polling
        # any remote. This asserts "the composite runs end-to-end into the script", not "the tag
        # gate works" — the gate's own verdicts are covered by tests/release-tag-check-selftest.sh.
        # Every optional input is left blank on purpose: that is the default consumer wiring, and
        # it is the path where a blank-to-absent translation bug would surface as `--timeout ""`.
        id: pass
        continue-on-error: true
        uses: ./release-tag-check
        with:
          before-sha: ${{ github.sha }}
          after-sha: ${{ github.sha }}

      - name: Invoke the action on a range it CANNOT classify (must fail the step)
        # THE SECOND DIRECTION, and the one that matters for a gate: a wrapper that swallowed the
        # script's non-zero status would look identical to a passing gate on the step above. An
        # unresolvable --after is refused at rc 2 by the script with no network access.
        id: refuse
        continue-on-error: true
        uses: ./release-tag-check
        with:
          before-sha: ${{ github.sha }}
          after-sha: '0000000000000000000000000000000000000000'

      - name: Assert both directions
        env:
          PASS_OUTCOME: ${{ steps.pass.outcome }}
          REFUSE_OUTCOME: ${{ steps.refuse.outcome }}
        run: |
          [ "$PASS_OUTCOME" = "success" ] || { echo "::error::release-tag-check action failed on a non-release range — the wrapper does not reach the script"; exit 1; }
          [ "$REFUSE_OUTCOME" = "failure" ] || { echo "::error::release-tag-check action reported '$REFUSE_OUTCOME' on an unclassifiable range — the wrapper is swallowing the script's refusal, which would make every release look tagged"; exit 1; }

  ci-gate:
    # ⭐ THE ONE REQUIRED STATUS CONTEXT for this repository (card#8261). Every other job in this
    # file is a leaf. `main` and `dev` carry the whole fleet branch-protection model —
    # `enforce_admins`, blocked force-pushes and deletions, the merge-method rulesets — with
    # `required_status_checks` at **`null`**, so the repo reads as protected on every surface an
    # operator inspects while NO CI result is required to merge.
    #
    # WHY THE OBVIOUS FIX IS NOT AVAILABLE. A protection `contexts` list is a hand-maintained
    # registry of check names, and the `selftest` matrix above is edited by ordinary pull
    # requests — `run-coverage-check-selftest` was added three PRs before this job. An
    # enumerated list rots in BOTH directions, and only one of them is loud: a name dropped from
    # the matrix never reports again and deadlocks every PR (loud), while a name ADDED to it is
    # required by nothing at all (silent, and the direction that matters). This job is the one
    # context that does not move when the matrix does.
    #
    # ⛔ RENAMING THIS JOB — or giving it a `name:`, which REPLACES the context string GitHub
    # reports — leaves branch protection waiting on a context that can never report again, i.e.
    # every pull request permanently unmergeable. `tests/ci-gate-selftest.sh` reds on both.
    #
    # ⛔ `if: always()` IS THE LOAD-BEARING HALF, and is where this shape is usually got wrong.
    # Without it the job is SKIPPED the moment a needed job fails — and a skipped required check
    # does NOT block a merge. The gate would then be satisfied precisely when the suite was red:
    # green for the wrong reason, which is strictly worse than the honest `null` it replaces. It
    # must run unconditionally and THEN assert on what it collected.
    #
    # ⚑ THE RULING ON EACH `needs.<job>.result`. Three of the four values are not `success`, and
    # each is a decision rather than a detail:
    #   * `failure`   — FAIL. The whole point.
    #   * `cancelled` — FAIL. A cancelled run MEASURED NOTHING; there is no verdict to inherit,
    #     and "nobody looked" must not read as "nothing wrong". `always()` rather than
    #     `!cancelled()` is precisely what keeps this job alive to say so.
    #   * `skipped`   — FAIL, and this is the judgement call. NO job in this file carries a
    #     job-level `if:` or its own `needs:`, so nothing here can be skipped today and this arm
    #     is currently unreachable — it is a ruling about the next edit, not about this tree.
    #     Reading `skipped` as a PASS would mean a future `if:` condition (or an upstream job
    #     that itself skips) silently drops a leg out of the merge gate with no signal anywhere,
    #     which is this card's own defect shape re-minted one layer down. Reading it as a FAIL
    #     costs a loud red that its author clears by saying out loud, here, that the skip is
    #     intended. Between a silent hole and a noisy question, the noisy one is cheaper.
    #   The results are read from `toJSON(needs)`, which is DERIVED from the list below — so a
    #   job added to `needs:` is gated with no second edit. A hand-written
    #   `needs.a.result != 'success' || needs.b.result != 'success'` chain would be a guard
    #   reading a proper subset of the set it claims to cover, i.e. card#5910's class again.
    #
    # THE `needs:` LIST IS NOT HELD LEVEL BY DILIGENCE. `tests/ci-gate-selftest.sh` derives every
    # top-level job in this file and reds in both directions, so a new job here is gated or the
    # build fails. That file also owns the ONE declaration of which contexts must be required
    # BESIDE this one: `needs:` cannot cross a workflow file, so the PR-triggered jobs living in
    # the sibling workflows are covered by nothing here and have to be named to branch
    # protection themselves. It is not restated in this comment, because a second copy is a
    # second thing to correct.
    needs:
      - shellcheck
      - drift-check-selftest
      - ci-matrix-parity
      - selftest
      - suite-home-containment
      - promote-action-selftest
      - release-artifacts-action-selftest
      - release-tag-check-action-selftest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every needed job succeeded
        env:
          # By env, never `${{ }}` inside the `run:` body — an Actions expression there is
          # textual substitution into the shell source, which is the script-injection class the
          # `release-artifacts-action-selftest` job already holds over the composite actions.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])

          # CONTROL, and not a hypothetical: this job IS the required context, so an aggregator
          # that needs nothing would report a green tick standing in front of an unmeasured
          # suite — the exact false-confidence this whole job exists to remove.
          if not needs:
              print("::error::ci-gate declares no `needs:` — it is standing in front of nothing")
              sys.exit(1)

          bad = []
          for job in sorted(needs):
              result = needs[job].get("result")
              print(f"{result:<9} {job}")
              if result != "success":
                  bad.append((job, result))

          for job, result in bad:
              print(f"::error::{job} reported '{result}' — only 'success' satisfies this gate")
          if bad:
              print(f"::error::{len(bad)} of {len(needs)} needed job(s) did not succeed")
              sys.exit(1)

          print(f"all {len(needs)} needed job(s) succeeded")
          PY
